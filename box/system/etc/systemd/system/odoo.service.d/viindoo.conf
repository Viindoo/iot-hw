# Viindoo IoT Box: the roll-back guard watches every start and stop of the box service.
# A leading "-" keeps a guard that fails from ever holding the box service back, and the longer
# time to start leaves the guard what it needs to put the box back on a slow card.
[Service]
ExecStartPre=-/usr/local/sbin/viin-box-guard
ExecStopPost=-/usr/local/sbin/viin-box-guard --stopped
TimeoutStartSec=600
# Name look-ups of the box service are bounded to about 4 s per name server; urllib3's timeout does not bound them.
Environment="RES_OPTIONS=timeout:2 attempts:2"
