# Viindoo IoT Box: the access point announces Viindoo-IoT- and the hardware address of the Wi-Fi interface,
# whoever starts it. The name is set in the configuration hostapd reads, just before it reads it; a leading "-"
# keeps a name that cannot be set from holding the access point back.
[Service]
ExecStartPre=-/usr/local/sbin/viin-box-access-point-name ${DAEMON_CONF}
