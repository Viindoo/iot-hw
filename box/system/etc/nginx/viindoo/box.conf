# Viindoo IoT Box: what the web server does with a request, whatever name the request came by.
# Included by every "server" block; a rule written anywhere else would hold for one name only.

ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers HIGH:!aNULL:!MD5;

location / {
    # The box service is handed each request under the web server's own name, never the name
    # the browser used: that is how it tells a page of its own from a page of another web site.
    proxy_pass http://127.0.0.1:8069;
    proxy_read_timeout 600s;
    # Who asked: the box service notes each use of the box page by the address of the device. It
    # believes this header only from this server, which sets it in place of any the browser sent;
    # every location that hands requests on sets it.
    proxy_set_header X-Real-IP $remote_addr;

    add_header Access-Control-Allow-Private-Network $viin_private_network always;
}

# The files of the box page (and the libraries of core it loads) are the same addresses before and
# after an update, and core would let a browser keep them for a week. Ask the box service every
# time instead: it answers an unchanged file "304 Not Modified" from the ETag and Last-Modified it
# already sends, which costs a header on the network of the box, and a changed file in full, so no
# page is ever built from files of two releases. Each location keeps only its own add_header lines
# and takes none from "location /", so the private-network answer is repeated here.
location ~ ^/[^/]+/static/ {
    proxy_pass http://127.0.0.1:8069;
    proxy_read_timeout 600s;
    proxy_set_header X-Real-IP $remote_addr;

    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;
    add_header Cache-Control "no-cache" always;
    add_header Access-Control-Allow-Private-Network $viin_private_network always;
}

# Shown while the box service does not answer: it is starting, or an update is being undone.
error_page 502 /viindoo-box-down.html;
location = /viindoo-box-down.html {
    internal;
    alias /usr/share/viindoo-iot/box-down.html;
    add_header Cache-Control no-store always;
}
